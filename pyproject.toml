[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-lean"
version = "0.2.0"
description = "Frontier-Class Math, Theoretical Physics & Lean 4 Reasoning Pipeline on 1x 96GB GPU"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.48.0",
    "peft>=0.14.0",
    "trl>=0.15.0",
    "accelerate>=1.2.0",
    "bitsandbytes>=0.45.0",
    "datasets>=3.2.0",
    "vllm>=0.7.0",
    "sympy>=1.13.0",
    "scipy>=1.14.0",
    "numpy>=1.26.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
flash-attn = [
    "flash-attn>=2.7.0"
]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "isort>=5.13.0"
]
